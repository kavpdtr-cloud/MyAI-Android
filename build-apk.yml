name: Собрать APK MyAI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Сборка Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Подготовить Android SDK
        uses: android-actions/setup-android@v4

      - name: Установить Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Собрать debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Сохранить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: MyAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
